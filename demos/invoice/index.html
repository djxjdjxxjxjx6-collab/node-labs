<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billable — Invoice Generator</title>
<meta name="description" content="Demo invoice generator by Yurii Starikov — live A4 preview, line items, taxes and discounts, templates, logo upload, saved invoices and PDF export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ebeae6;--panel:#fff;--ink:#18181b;--ink2:#52525b;--mut:#a1a1aa;--line:#e4e4e7;--acc:#2f5d50;--fs:"Instrument Serif",Georgia,serif;--fb:"Inter",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.logo{font-family:var(--fs);font-size:1.6rem;margin-right:12px}
.logo i{color:var(--acc)}
.bar .sp{flex:1}
.btn{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:.86rem}
.btn:hover{border-color:#c4c4c8}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.p:hover{background:#333}
.saved{position:relative}
.dd{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 40px -20px rgba(0,0,0,.3);width:300px;padding:6px;display:none;z-index:20}
.dd.open{display:block}
.dd button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;gap:8px}
.dd button:hover{background:var(--bg)}
.dd small{color:var(--mut)}
.dd .x{color:var(--mut);padding:0 4px}
.lay{display:grid;grid-template-columns:440px 1fr;height:calc(100vh - 61px)}
@media(max-width:1060px){.lay{grid-template-columns:1fr;height:auto}}
.ed{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:18px 20px 40px}
.sec{border-bottom:1px solid var(--line);padding:16px 0}
.sec:first-child{padding-top:0}
.sec h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin-bottom:10px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:grid;gap:4px}
.fld label{font-size:.76rem;color:var(--ink2);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:0;background:#fafafa;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);background:#fff}
.fld textarea{resize:vertical;min-height:58px}
.fld.bad input{border-color:#dc2626}
.mt{margin-top:8px}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr 64px 86px 28px;gap:6px;align-items:start;background:#fafafa;border:1px solid var(--line);border-radius:10px;padding:8px}
.item input{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;outline:0;width:100%;min-width:0}
.item input:focus{border-color:var(--acc);background:#fff}
.item input.n{text-align:right;font-variant-numeric:tabular-nums}
.item .rm{border:0;background:none;color:var(--mut);cursor:pointer;height:30px;border-radius:6px}
.item .rm:hover{color:#dc2626;background:#fee2e2}
.item .desc{grid-column:1/-1}
.item .desc input{font-size:.8rem;color:var(--ink2)}
.ihd{display:grid;grid-template-columns:1fr 64px 86px 28px;gap:6px;font-size:.7rem;color:var(--mut);padding:0 8px 4px;text-transform:uppercase;letter-spacing:.06em}
.add{width:100%;border:1px dashed #c4c4c8;background:none;border-radius:10px;padding:9px;cursor:pointer;color:var(--ink2);font-weight:600;margin-top:8px}
.add:hover{border-color:var(--acc);color:var(--acc)}
.themes{display:flex;gap:8px;align-items:center}
.themes button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.themes button.on{box-shadow:0 0 0 2px var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:#fff;padding:6px 10px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.up{display:flex;gap:10px;align-items:center}
.up .lg{width:46px;height:46px;border-radius:10px;border:1px dashed #c4c4c8;display:grid;place-items:center;overflow:hidden;color:var(--mut);font-size:.7rem}
.up .lg img{width:100%;height:100%;object-fit:contain}
.pv{overflow:auto;padding:30px 20px 60px;display:flex;justify-content:center}
.paper{width:794px;min-height:1123px;background:#fff;box-shadow:0 30px 60px -30px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.04);padding:64px 64px 56px;position:relative;transform-origin:top center;flex:none;color:#18181b}
.paper .top{display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
.paper .brand{display:flex;gap:14px;align-items:center}
.paper .brand .lg{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--fs);font-size:1.8rem;overflow:hidden}
.paper .brand .lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.paper .brand b{font-size:1.05rem;display:block}
.paper .brand small{color:#71717a;font-size:.8rem;white-space:pre-line}
.paper h1{font-family:var(--fs);font-weight:400;font-size:3.6rem;line-height:1;text-align:right}
.paper .num{text-align:right;color:#71717a;font-size:.86rem;margin-top:6px}
.paper .meta{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:20px;margin-top:46px;padding:20px 0;border-top:1px solid #e4e4e7;border-bottom:1px solid #e4e4e7}
.paper .meta small{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:#a1a1aa;margin-bottom:4px}
.paper .meta p{white-space:pre-line;font-size:.86rem}
.paper .meta b{font-size:.92rem}
.paper table{width:100%;border-collapse:collapse;margin-top:30px;font-size:.88rem}
.paper th{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#a1a1aa;font-weight:600;text-align:left;padding:0 0 10px;border-bottom:1.5px solid #18181b}
.paper th:not(:first-child),.paper td:not(:first-child){text-align:right}
.paper td{padding:12px 0;border-bottom:1px solid #f0f0f2;vertical-align:top;font-variant-numeric:tabular-nums}
.paper td small{display:block;color:#71717a;font-size:.78rem;margin-top:2px}
.paper .tot{margin-left:auto;width:300px;margin-top:20px;font-size:.88rem}
.paper .tot div{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.paper .tot .g{border-top:1.5px solid #18181b;margin-top:6px;padding-top:12px;font-size:1.05rem;font-weight:700}
.paper .tot .g span:last-child{font-family:var(--fs);font-size:2rem;font-weight:400}
.paper .notes{margin-top:50px;display:grid;grid-template-columns:1fr 1fr;gap:30px;font-size:.84rem;color:#52525b}
.paper .notes small{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:#a1a1aa;margin-bottom:6px}
.paper .notes p{white-space:pre-line}
.paper .foot{position:absolute;left:64px;right:64px;bottom:40px;display:flex;justify-content:space-between;font-size:.74rem;color:#a1a1aa;border-top:1px solid #f0f0f2;padding-top:12px}
.paper .stamp{position:absolute;left:80px;bottom:330px;border:3px solid;border-radius:10px;padding:6px 16px;font-weight:800;letter-spacing:.2em;font-size:1.3rem;transform:rotate(-12deg);opacity:.85}
.paper.bold .band{position:absolute;left:0;right:0;top:0;height:12px}
.paper.bold h1{font-size:4.2rem}
.paper.bold th{border-bottom:0;background:var(--pc);color:#fff;padding:10px 12px}
.paper.bold td{padding:12px}
.paper.bold th:first-child,.paper.bold td:first-child{padding-left:12px}
.paper.bold .tot .g{background:var(--pc);color:#fff;border:0;padding:12px;border-radius:8px}
.demo{text-align:center;color:var(--mut);font-size:.76rem;margin-top:10px}.demo a{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,90px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:.86rem;z-index:90;transition:.3s}
.toast.show{transform:translate(-50%,0);opacity:1}
@media print{@page{size:A4;margin:0}body{background:#fff}.bar,.ed,.demo,.toast{display:none!important}.lay{display:block;height:auto}.pv{padding:0;overflow:visible;display:block}.paper{box-shadow:none;transform:none!important;margin:0}}
</style>
</head>
<body>
<div class="bar">
  <span class="logo">Bill<i>able</i></span>
  <button class="btn" id="new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New</button>
  <button class="btn" id="dup"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Duplicate</button>
  <div class="saved"><button class="btn" id="savedBtn"><svg class="i" viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg>Saved <b id="savedN">0</b></button><div class="dd" id="dd"></div></div>
  <span class="sp"></span>
  <span id="saveState" style="color:var(--mut);font-size:.8rem">Saved</span>
  <button class="btn p" id="pdf"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Download PDF</button>
</div>
<div class="lay">
  <form class="ed" id="ed" novalidate>
    <div class="sec"><h3>Design</h3><div style="display:flex;align-items:center;gap:10px"><div class="themes" id="themes"></div><div class="seg" id="tpl"><button type="button" data-t="classic" class="on">Classic</button><button type="button" data-t="bold">Bold</button></div></div></div>
    <div class="sec"><h3>Invoice</h3><div class="g2"><div class="fld"><label>Invoice number</label><input id="no"></div><div class="fld"><label>Currency</label><select id="cur"><option value="USD">USD $</option><option value="EUR">EUR €</option><option value="GBP">GBP £</option><option value="KZT">KZT ₸</option></select></div>
      <div class="fld"><label>Issue date</label><input type="date" id="issue"></div><div class="fld"><label>Due date</label><select id="terms"><option value="0">Due on receipt</option><option value="7">Net 7</option><option value="14">Net 14</option><option value="30">Net 30</option></select></div></div>
      <div class="fld mt"><label>Status</label><select id="status"><option value="">Draft (no stamp)</option><option value="due">Due</option><option value="paid">Paid</option><option value="overdue">Overdue</option></select></div></div>
    <div class="sec"><h3>From</h3><div class="up"><label class="lg" id="lgBox" title="Upload logo">Logo</label><input type="file" id="logo" accept="image/*" hidden><div class="fld" style="flex:1"><input id="fromName" placeholder="Your name or business"></div></div>
      <div class="fld mt"><textarea id="fromAddr" placeholder="Address, email, tax ID"></textarea></div></div>
    <div class="sec"><h3>Bill to</h3><div class="fld"><input id="toName" placeholder="Client name"></div><div class="fld mt"><textarea id="toAddr" placeholder="Client address and email"></textarea></div></div>
    <div class="sec"><h3>Items</h3><div class="ihd"><span>Item</span><span style="text-align:right">Qty</span><span style="text-align:right">Rate</span><span></span></div><div class="items" id="items"></div><button type="button" class="add" id="addItem">+ Add line item</button></div>
    <div class="sec"><h3>Adjustments</h3><div class="g2"><div class="fld"><label>Tax rate (%)</label><input id="tax" type="number" min="0" step="0.1"></div><div class="fld"><label>Discount (%)</label><input id="disc" type="number" min="0" max="100" step="1"></div></div></div>
    <div class="sec"><h3>Notes & payment</h3><div class="fld"><label>Payment details</label><textarea id="pay"></textarea></div><div class="fld mt"><label>Note to client</label><textarea id="note"></textarea></div></div>
    <p class="demo">Demo project by <a href="https://github.com/djxjdjxxjxjx6-collab">Yurii Starikov</a> · everything stays in your browser</p>
  </form>
  <div class="pv" id="pv"><div class="paper" id="paper"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const THEMES=['#2f5d50','#1e3a8a','#7c2d12','#6d28d9','#18181b'];
const SYM={USD:'$',EUR:'€',GBP:'£',KZT:'₸'};
const iso=d=>d.toISOString().slice(0,10);
const blank=()=>({id:'inv'+Date.now(),no:'INV-'+String(Math.floor(Math.random()*900)+100).padStart(4,'0'),cur:'USD',issue:iso(new Date()),terms:'14',status:'due',theme:0,tpl:'classic',logo:'',
  fromName:'',fromAddr:'',toName:'',toAddr:'',items:[{n:'',d:'',q:1,r:0}],tax:0,disc:0,pay:'',note:'Thank you for your business!'});
const sample=()=>({id:'inv-sample',no:'INV-0042',cur:'USD',issue:iso(new Date()),terms:'14',status:'due',theme:0,tpl:'classic',logo:'',
  fromName:'Yurii Starikov · Web Development',fromAddr:'Almaty, Kazakhstan\nhello@yurii.dev',
  toName:'BrightSmile Dental Studio',toAddr:'1240 Maple Avenue, Suite 200\nSpringfield, IL 62704\nemily@brightsmile.com',
  items:[{n:'Landing page design & development',d:'Responsive, 7 sections, online booking form',q:1,r:650},{n:'Booking form integration',d:'Validation, time slots, email notification',q:1,r:180},{n:'Content updates',d:'Hourly rate',q:6,r:25},{n:'Hosting setup & launch',d:'Domain, SSL, analytics',q:1,r:90}],
  tax:0,disc:10,pay:'Bank transfer or Payoneer\nAccount details sent by email',note:'Thank you for your business! Questions about this invoice? Just reply to the email.'});
let list=[],inv;
try{list=JSON.parse(localStorage.getItem('billable-list'))||[]}catch(e){}
if(!list.length)list=[sample()];inv=list[0];
const fields=['no','cur','issue','terms','status','fromName','fromAddr','toName','toAddr','tax','disc','pay','note'];
function fill(){fields.forEach(f=>$('#'+f).value=inv[f]);renderItems();renderThemes();renderLogo()}
function renderItems(){$('#items').innerHTML=inv.items.map((it,i)=>`<div class="item" data-i="${i}"><input data-k="n" value="${esc(it.n)}" placeholder="Item name" aria-label="Item name"><input class="n" data-k="q" type="number" min="0" step="any" value="${it.q}" aria-label="Quantity"><input class="n" data-k="r" type="number" min="0" step="any" value="${it.r}" aria-label="Rate"><button type="button" class="rm" data-rm="${i}" aria-label="Remove">✕</button><div class="desc"><input data-k="d" value="${esc(it.d)}" placeholder="Description (optional)" aria-label="Description"></div></div>`).join('')}
function renderThemes(){$('#themes').innerHTML=THEMES.map((c,i)=>`<button type="button" data-th="${i}" class="${i===inv.theme?'on':''}" style="background:${c}" aria-label="Color ${i+1}"></button>`).join('');$('#tpl').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===inv.tpl))}
function renderLogo(){$('#lgBox').innerHTML=inv.logo?`<img src="${inv.logo}" alt="">`:'Logo'}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function calc(){const sub=inv.items.reduce((s,i)=>s+(+i.q||0)*(+i.r||0),0),disc=sub*(+inv.disc||0)/100,tax=(sub-disc)*(+inv.tax||0)/100;return {sub,disc,tax,total:sub-disc+tax}}
function money(n){const s=SYM[inv.cur];return (inv.cur==='KZT'?'':s)+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+(inv.cur==='KZT'?' '+s:'')}
function preview(){const t=calc(),pc=THEMES[inv.theme],due=new Date(inv.issue+'T12:00');due.setDate(due.getDate()+ +inv.terms);
  const f=d=>d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const st={due:['DUE','#b45309'],paid:['PAID','#15803d'],overdue:['OVERDUE','#b91c1c']}[inv.status];
  const p=$('#paper');p.className='paper'+(inv.tpl==='bold'?' bold':'');p.style.setProperty('--pc',pc);
  p.innerHTML=`${inv.tpl==='bold'?`<div class="band" style="background:${pc}"></div>`:''}
   <div class="top"><div class="brand"><div class="lg" style="background:${pc}">${inv.logo?`<img src="${inv.logo}" alt="">`:esc((inv.fromName||'Y')[0])}</div><div><b>${esc(inv.fromName)||'<span style="color:#d4d4d8">Your business</span>'}</b><small>${esc(inv.fromAddr)}</small></div></div>
    <div><h1 style="color:${inv.tpl==='bold'?pc:'#18181b'}">Invoice</h1><div class="num">${esc(inv.no)}</div></div></div>
   ${st?`<div class="stamp" style="color:${st[1]};border-color:${st[1]}">${st[0]}</div>`:''}
   <div class="meta"><div><small>Billed to</small><b>${esc(inv.toName)||'<span style="color:#d4d4d8">Client name</span>'}</b><p>${esc(inv.toAddr)}</p></div><div><small>Issued</small><p>${f(new Date(inv.issue+'T12:00'))}</p></div><div><small>Due</small><p>${+inv.terms?f(due):'On receipt'}</p><small style="margin-top:10px">Amount due</small><b style="color:${pc}">${money(t.total)}</b></div></div>
   <table><thead><tr><th>Description</th><th style="width:70px">Qty</th><th style="width:120px">Rate</th><th style="width:130px">Amount</th></tr></thead><tbody>${inv.items.map(i=>`<tr><td><b style="font-weight:600">${esc(i.n)||'<span style="color:#d4d4d8">Item</span>'}</b>${i.d?`<small>${esc(i.d)}</small>`:''}</td><td>${+i.q||0}</td><td>${money(+i.r||0)}</td><td>${money((+i.q||0)*(+i.r||0))}</td></tr>`).join('')}</tbody></table>
   <div class="tot"><div><span>Subtotal</span><span>${money(t.sub)}</span></div>${+inv.disc?`<div><span>Discount (${inv.disc}%)</span><span>−${money(t.disc)}</span></div>`:''}${+inv.tax?`<div><span>Tax (${inv.tax}%)</span><span>${money(t.tax)}</span></div>`:''}<div class="g"><span>Total ${inv.cur}</span><span>${money(t.total)}</span></div></div>
   <div class="notes"><div><small>Payment details</small><p>${esc(inv.pay)}</p></div><div><small>Note</small><p>${esc(inv.note)}</p></div></div>
   <div class="foot"><span>${esc(inv.fromName)}</span><span>${esc(inv.no)} · Page 1 of 1</span></div>`;
  fit()}
function fit(){const pv=$('#pv'),p=$('#paper'),s=Math.min(1,(pv.clientWidth-40)/794);p.style.transform=`scale(${s})`;p.style.marginBottom=`${-(1-s)*1123}px`}
let st;function persist(){$('#saveState').textContent='Saving…';clearTimeout(st);st=setTimeout(()=>{const i=list.findIndex(x=>x.id===inv.id);if(i<0)list.unshift(inv);else list[i]=inv;
  try{localStorage.setItem('billable-list',JSON.stringify(list))}catch(e){}$('#saveState').textContent='Saved';renderSaved()},350)}
function renderSaved(){$('#savedN').textContent=list.length;$('#dd').innerHTML=list.map(x=>{const t=x.items.reduce((s,i)=>s+(+i.q||0)*(+i.r||0),0)*(1-(+x.disc||0)/100)*(1+(+x.tax||0)/100);
  return `<button type="button" data-open="${x.id}"><span><b>${esc(x.no)}</b> <small>${esc(x.toName||'No client')}</small></span><span><small>${SYM[x.cur]}${t.toFixed(0)}</small>${list.length>1?` <span class="x" data-del="${x.id}" title="Delete">✕</span>`:''}</span></button>`}).join('')}
$('#ed').addEventListener('input',e=>{const el=e.target;if(el.dataset.k){const i=+el.closest('.item').dataset.i;inv.items[i][el.dataset.k]=el.type==='number'?el.value:el.value}else if(fields.includes(el.id))inv[el.id]=el.value;preview();persist()});
$('#ed').addEventListener('click',e=>{const rm=e.target.closest('[data-rm]'),th=e.target.closest('[data-th]'),tp=e.target.closest('[data-t]');
  if(rm){if(inv.items.length>1){inv.items.splice(+rm.dataset.rm,1);renderItems();preview();persist()}else toast('An invoice needs at least one line')}
  if(th){inv.theme=+th.dataset.th;renderThemes();preview();persist()}if(tp){inv.tpl=tp.dataset.t;renderThemes();preview();persist()}});
$('#addItem').onclick=()=>{inv.items.push({n:'',d:'',q:1,r:0});renderItems();preview();persist();$('#items').lastElementChild.querySelector('input').focus()};
$('#lgBox').onclick=()=>$('#logo').click();
$('#logo').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>600000){toast('Please use a logo under 600 KB');return}const r=new FileReader();r.onload=()=>{inv.logo=r.result;renderLogo();preview();persist()};r.readAsDataURL(f)};
$('#new').onclick=()=>{inv=blank();list.unshift(inv);fill();preview();persist();toast('New invoice created')};
$('#dup').onclick=()=>{inv={...JSON.parse(JSON.stringify(inv)),id:'inv'+Date.now(),no:inv.no.replace(/(\d+)$/,m=>String(+m+1).padStart(m.length,'0')),status:'due',issue:iso(new Date())};list.unshift(inv);fill();preview();persist();toast('Invoice duplicated as '+inv.no)};
$('#savedBtn').onclick=e=>{e.stopPropagation();$('#dd').classList.toggle('open')};
$('#dd').onclick=e=>{e.stopPropagation();const d=e.target.closest('[data-del]');if(d){list=list.filter(x=>x.id!==d.dataset.del);if(inv.id===d.dataset.del)inv=list[0];fill();preview();try{localStorage.setItem('billable-list',JSON.stringify(list))}catch(er){}renderSaved();return}
  const o=e.target.closest('[data-open]');if(o){inv=list.find(x=>x.id===o.dataset.open);fill();preview();$('#dd').classList.remove('open')}};
document.addEventListener('click',()=>$('#dd').classList.remove('open'));
$('#pdf').onclick=()=>{const bad=[['fromName',!inv.fromName.trim()],['toName',!inv.toName.trim()]];let ok=true;bad.forEach(([id,b])=>{$('#'+id).parentElement.classList.toggle('bad',b);if(b)ok=false});
  if(!ok){toast('Add your name and the client name first');return}document.title=inv.no+' - '+inv.toName;window.print();document.title='Billable — Invoice Generator'};
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400)}
addEventListener('resize',fit);
fill();preview();renderSaved();
</script>
</body>
</html>
