<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit — Live Crypto Market Dashboard</title>
<meta name="description" content="Demo crypto dashboard by Yurii Starikov — live prices from the CoinGecko API, sortable market table with sparklines, watchlist, coin details and converter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0f;--bg2:#101219;--card:#13161f;--line:#232736;--txt:#e9ebf3;--mut:#8a90a6;--dim:#5b6178;--gold:#f5b74a;--up:#2fc58a;--dn:#f0596a;
  --fd:"Space Grotesk",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fd);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.m{font-family:var(--fm);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ticker{border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;background:var(--bg2);font-size:.8rem}
.ticker div{display:inline-flex;gap:30px;padding:8px 0;animation:tk 60s linear infinite}
.ticker span{display:inline-flex;gap:8px}
.ticker b{color:var(--mut);font-weight:500}
@keyframes tk{to{transform:translateX(-50%)}}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
header .wrap{display:flex;align-items:center;gap:18px;height:68px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem}
.logo svg{width:28px;height:28px}
.live{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--mut);margin-left:auto}
.live i{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(47,197,138,.6);animation:pl 2s infinite}
.live.off i{background:var(--gold);animation:none}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(47,197,138,0)}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;cursor:pointer;color:var(--mut);font-weight:600}
.seg button.on{background:var(--card);color:var(--gold)}
.ref{background:var(--card);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.ref.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.hero{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:14px;margin-top:8px}
@media(max-width:1000px){.hero{grid-template-columns:1fr 1fr}}@media(max-width:640px){.hero{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.mc small{color:var(--mut);font-size:.78rem;display:block}
.mc .big{font-size:2rem;font-weight:600;margin:4px 0}
.mc .bar{display:flex;height:8px;border-radius:9px;overflow:hidden;margin-top:12px;gap:2px}
.mc .lg{display:flex;gap:12px;margin-top:8px;font-size:.76rem;color:var(--mut);flex-wrap:wrap}
.mc .lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.mv h4{font-size:.78rem;color:var(--mut);font-weight:500;display:flex;justify-content:space-between}
.mv .r{display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer}
.mv .r img,.coin img{width:24px;height:24px;border-radius:50%;background:var(--line)}
.mv .r b{font-weight:600}
.mv .r .m{margin-left:auto;font-size:.84rem}
.tools{display:flex;gap:10px;margin:22px 0 12px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--mut);font-weight:600;display:flex;gap:6px;align-items:center}
.tabs button.on{background:var(--card);color:var(--txt)}
.tabs em{font-style:normal;background:var(--gold);color:#111;border-radius:99px;font-size:.68rem;padding:0 7px}
.search{flex:1;min-width:200px;max-width:360px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--mut)}
.search input{border:0;background:none;outline:0;padding:10px 0;width:100%;color:var(--txt)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:900px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600;text-align:right;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;position:sticky;top:0;background:var(--card)}
th:nth-child(-n+3){text-align:left}
th.s{color:var(--gold)}
td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td:nth-child(-n+3){text-align:left}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:#171b26}
tbody tr:last-child td{border-bottom:0}
.star{background:none;border:0;cursor:pointer;color:var(--dim);font-size:1rem;line-height:1}
.star.on{color:var(--gold)}
.coin{display:flex;align-items:center;gap:10px}
.coin b{font-weight:600}.coin small{color:var(--dim);text-transform:uppercase;font-family:var(--fm);font-size:.76rem}
.flash-up{animation:fu 1s}.flash-dn{animation:fdn 1s}
@keyframes fu{0%{background:rgba(47,197,138,.25)}}@keyframes fdn{0%{background:rgba(240,89,106,.25)}}
.spark{width:120px;height:36px}
.skel td{color:transparent}.skel td span{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#1a1e2a,#242a3a,#1a1e2a);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--mut);padding:40px}
.note{font-size:.78rem;color:var(--dim);margin:12px 2px 30px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.note a{color:var(--gold)}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.3s;z-index:40}
.ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--bg2);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:.4s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:24px}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;gap:12px}
.dh img{width:44px;height:44px;border-radius:50%}
.dh h2{font-size:1.5rem}.dh small{color:var(--mut)}
.dh .x{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;cursor:pointer}
.price{font-size:2.4rem;font-weight:600;margin-top:18px}
.chg{display:flex;gap:10px;margin-top:4px;font-size:.86rem}
.chg span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.bigchart{margin-top:18px;position:relative}
.bigchart svg{width:100%;height:220px;display:block}
.bigchart .tt{position:absolute;pointer-events:none;background:var(--txt);color:var(--bg);font-size:.76rem;padding:5px 9px;border-radius:7px;transform:translate(-50%,-120%);opacity:0;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stats small{color:var(--mut);font-size:.74rem;display:block}
.stats b{font-family:var(--fm);font-weight:500}
.range{margin-top:18px}
.range .t{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mut)}
.range .b{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--dn),var(--gold),var(--up));margin:6px 0;position:relative}
.range .b i{position:absolute;top:-4px;width:4px;height:14px;background:var(--txt);border-radius:2px}
.conv{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.conv h4{font-size:.9rem;margin-bottom:10px}
.conv .r{display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-top:8px}
.conv input{border:0;background:none;outline:0;padding:11px 0;font-family:var(--fm);font-size:1.05rem;width:100%;color:var(--txt)}
.conv span{color:var(--mut);font-family:var(--fm);font-size:.86rem}
.dw{margin-top:18px;width:100%;padding:13px;border-radius:12px;border:1px solid var(--gold);background:none;color:var(--gold);font-weight:700;cursor:pointer}
.dw.on{background:var(--gold);color:#111}
</style>
</head>
<body>
<div class="ticker"><div id="ticker"></div></div>
<header><div class="wrap">
  <div class="logo"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="6" fill="#f5b74a"/><ellipse cx="16" cy="16" rx="14" ry="6" stroke="#f5b74a" stroke-width="2" transform="rotate(-25 16 16)"/></svg>Orbit Markets</div>
  <div class="live" id="live"><i></i><span id="liveTxt">Connecting…</span></div>
  <div class="seg" id="cur"><button class="on" data-c="usd">USD</button><button data-c="eur">EUR</button><button data-c="gbp">GBP</button></div>
  <button class="ref" id="ref" aria-label="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
</div></header>
<main class="wrap">
  <section class="hero">
    <div class="card mc"><small>Total market cap · top 50</small><div class="big m" id="mcap">—</div><span class="m" id="mcapCh"></span>
      <div class="bar" id="dom"></div><div class="lg" id="domLg"></div></div>
    <div class="card mv"><h4>🔥 Top gainers <span>24h</span></h4><div id="gain"></div></div>
    <div class="card mv"><h4>📉 Top losers <span>24h</span></h4><div id="lose"></div></div>
    <div class="card mv"><h4>⭐ Your watchlist</h4><div id="wl"></div></div>
  </section>
  <div class="tools">
    <div class="tabs" id="tabs"><button class="on" data-t="all">All coins</button><button data-t="watch">Watchlist <em id="wcount">0</em></button><button data-t="gain">Gainers</button><button data-t="lose">Losers</button></div>
    <label class="search"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search coin or symbol…"></label>
  </div>
  <div class="tw"><table><thead><tr><th style="width:36px"></th><th data-k="rank" style="width:40px">#</th><th data-k="name">Coin</th><th data-k="price">Price</th><th data-k="h1">1h</th><th data-k="h24">24h</th><th data-k="d7">7d</th><th data-k="vol">Volume 24h</th><th data-k="cap">Market cap</th><th>Last 7 days</th></tr></thead><tbody id="tb"></tbody></table></div>
  <div class="note"><span id="upd"></span><span>Data: <a href="https://www.coingecko.com" target="_blank" rel="noopener">CoinGecko API</a> · Demo by <a href="https://github.com/djxjdjxxjxjx6-collab">Yurii Starikov</a> · Not financial advice</span></div>
</main>
<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer"></aside>

<script>
const $=s=>document.querySelector(s);
let coins=[],cur='usd',sortK='rank',dir=1,tab='all',q='',open=null,prevPrice={};
let watch=[];try{watch=JSON.parse(localStorage.getItem('orbit-watch'))||['bitcoin','ethereum','solana']}catch(e){watch=['bitcoin','ethereum','solana']}
const SYM={usd:'$',eur:'€',gbp:'£'};
const fmtP=v=>{if(v==null)return '—';const s=SYM[cur];return s+(v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:0}):v>=1?v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):v.toPrecision(4))};
const big=v=>{const s=SYM[cur];return v>=1e12?s+(v/1e12).toFixed(2)+'T':v>=1e9?s+(v/1e9).toFixed(2)+'B':v>=1e6?s+(v/1e6).toFixed(2)+'M':s+Math.round(v).toLocaleString()};
const pct=v=>v==null?'<span style="color:var(--dim)">—</span>':`<span class="${v>=0?'up':'dn'}">${v>=0?'▲':'▼'} ${Math.abs(v).toFixed(2)}%</span>`;
function spark(arr,w=120,h=36,fill,upHint){if(!arr||arr.length<2)return '';const mn=Math.min(...arr),mx=Math.max(...arr),st=Math.max(1,Math.floor(arr.length/60)),a=arr.filter((_,i)=>i%st===0);
  const pts=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-2-(v-mn)/(mx-mn||1)*(h-4)).toFixed(1)}`),up=upHint!=null?upHint>=0:a[a.length-1]>=a[0],c=up?'var(--up)':'var(--dn)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${fill?`<path d="M0,${h} L${pts.join(' L')} L${w},${h}Z" fill="${up?'rgba(47,197,138,.12)':'rgba(240,89,106,.12)'}"/>`:''}<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`}
const map=c=>({id:c.id,rank:c.market_cap_rank,name:c.name,sym:c.symbol,img:c.image,price:c.current_price,h1:c.price_change_percentage_1h_in_currency,h24:c.price_change_percentage_24h_in_currency??c.price_change_percentage_24h,d7:c.price_change_percentage_7d_in_currency,vol:c.total_volume,cap:c.market_cap,hi:c.high_24h,lo:c.low_24h,ath:c.ath,athc:c.ath_change_percentage,supply:c.circulating_supply,sp:c.sparkline_in_7d?.price||[]});

async function load(manual){
  $('#ref').classList.add('spin');if(!coins.length)skeleton();
  try{const r=await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=${cur}&order=market_cap_desc&per_page=50&page=1&sparkline=true&price_change_percentage=1h,24h,7d`);
    if(!r.ok)throw new Error(r.status);const j=await r.json();
    coins.forEach(c=>prevPrice[c.id]=c.price);coins=j.map(map);try{localStorage.setItem('orbit-cache-'+cur,JSON.stringify({t:Date.now(),d:j}))}catch(e){}
    status(true,'Live · updated '+new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
  }catch(err){let cache=null;try{cache=JSON.parse(localStorage.getItem('orbit-cache-'+cur))}catch(e){}
    if(cache){coins=cache.d.map(map);status(false,'Rate limited · showing data from '+new Date(cache.t).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}))}
    else status(false,'API unavailable · retrying in 60s');}
  $('#ref').classList.remove('spin');render();
}
function status(ok,t){$('#live').classList.toggle('off',!ok);$('#liveTxt').textContent=t;$('#upd').textContent=ok?'Prices refresh automatically every 60 seconds':'The free API allows a limited number of requests per minute'}
function skeleton(){$('#tb').innerHTML=Array(10).fill(0).map(()=>`<tr class="skel">${Array(10).fill('<td><span>&nbsp;</span></td>').join('')}</tr>`).join('')}
function render(){
  const tot=coins.reduce((s,c)=>s+(c.cap||0),0),capCh=coins.reduce((s,c)=>s+(c.cap||0)*(c.h24||0)/100,0)/tot*100;
  $('#mcap').textContent=coins.length?big(tot):'—';$('#mcapCh').innerHTML=coins.length?pct(capCh)+' <span style="color:var(--dim)">24h</span>':'';
  const top=coins.slice(0,4),cols=['#f5b74a','#8b8bf5','#2fc58a','#4fb3e8','#3a3f52'];
  const parts=[...top.map(c=>[c.sym.toUpperCase(),c.cap/tot*100]),['Other',(1-top.reduce((s,c)=>s+c.cap,0)/tot)*100]];
  $('#dom').innerHTML=coins.length?parts.map(([n,p],i)=>`<i style="width:${p}%;background:${cols[i]}" title="${n} ${p.toFixed(1)}%"></i>`).join(''):'';
  $('#domLg').innerHTML=coins.length?parts.map(([n,p],i)=>`<span><i style="background:${cols[i]}"></i>${n} ${p.toFixed(1)}%</span>`).join(''):'';
  const byCh=[...coins].filter(c=>c.h24!=null).sort((a,b)=>b.h24-a.h24),row=c=>`<div class="r" data-id="${c.id}"><img src="${c.img}" alt="" loading="lazy"><b>${c.sym.toUpperCase()}</b><span class="m">${fmtP(c.price)}</span><span class="m" style="min-width:74px;text-align:right">${pct(c.h24)}</span></div>`;
  $('#gain').innerHTML=byCh.slice(0,3).map(row).join('');$('#lose').innerHTML=byCh.slice(-3).reverse().map(row).join('');
  const w=coins.filter(c=>watch.includes(c.id));$('#wl').innerHTML=w.length?w.slice(0,3).map(row).join(''):'<p style="color:var(--dim);margin-top:12px;font-size:.84rem">Tap ☆ next to any coin to follow it here.</p>';
  $('#wcount').textContent=watch.length;
  $('#ticker').innerHTML=[0,1].map(()=>coins.slice(0,15).map(c=>`<span><b>${c.sym.toUpperCase()}</b><span class="m">${fmtP(c.price)}</span>${pct(c.h24)}</span>`).join('')).join('');
  table();if(open)drawer(open,true);
}
function table(){
  let l=coins.filter(c=>(!q||(c.name+' '+c.sym).toLowerCase().includes(q))&&(tab!=='watch'||watch.includes(c.id))&&(tab!=='gain'||c.h24>0)&&(tab!=='lose'||c.h24<0));
  if(tab==='gain'&&sortK==='rank')l.sort((a,b)=>b.h24-a.h24);else if(tab==='lose'&&sortK==='rank')l.sort((a,b)=>a.h24-b.h24);
  else l.sort((a,b)=>{const A=a[sortK],B=b[sortK];return (typeof A==='string'?A.localeCompare(B):(A??-1e18)-(B??-1e18))*dir});
  document.querySelectorAll('th[data-k]').forEach(th=>{th.classList.toggle('s',th.dataset.k===sortK);th.textContent=th.textContent.replace(/ [▲▼]$/,'')+(th.dataset.k===sortK?(dir>0?' ▲':' ▼'):'')});
  if(!coins.length)return;
  $('#tb').innerHTML=l.length?l.map(c=>{const f=prevPrice[c.id]&&prevPrice[c.id]!==c.price?(c.price>prevPrice[c.id]?'flash-up':'flash-dn'):'';
    return `<tr data-id="${c.id}"><td><button class="star${watch.includes(c.id)?' on':''}" data-w="${c.id}" aria-label="Watch ${c.name}">${watch.includes(c.id)?'★':'☆'}</button></td><td class="m" style="color:var(--dim)">${c.rank??'—'}</td>
     <td><div class="coin"><img src="${c.img}" alt="" loading="lazy"><b>${c.name}</b><small>${c.sym}</small></div></td><td class="m ${f}">${fmtP(c.price)}</td><td class="m">${pct(c.h1)}</td><td class="m">${pct(c.h24)}</td><td class="m">${pct(c.d7)}</td>
     <td class="m">${big(c.vol)}</td><td class="m">${big(c.cap)}</td><td>${spark(c.sp,120,36,false,c.d7)}</td></tr>`}).join('')
    :`<tr><td colspan="10" class="empty">${tab==='watch'?'Your watchlist is empty. Tap ☆ to add coins.':'No coins match “'+q+'”'}</td></tr>`;
}
function drawer(id,keep){const c=coins.find(x=>x.id===id);if(!c)return;open=id;
  const amt=keep&&$('#cvA')?$('#cvA').value:1;
  $('#drawer').innerHTML=`<div class="dh"><img src="${c.img}" alt=""><div><h2>${c.name}</h2><small class="m">${c.sym.toUpperCase()} · Rank #${c.rank}</small></div><button class="x" id="dx" aria-label="Close">✕</button></div>
   <div class="price m">${fmtP(c.price)}</div><div class="chg m"><span>1h ${pct(c.h1)}</span><span>24h ${pct(c.h24)}</span><span>7d ${pct(c.d7)}</span></div>
   <div class="bigchart" id="bc">${spark(c.sp,480,200,true,c.d7).replace('class="spark"','')}<div class="tt" id="btt"></div></div>
   <div class="range"><div class="t"><span>24h low <b class="m">${fmtP(c.lo)}</b></span><span>24h high <b class="m">${fmtP(c.hi)}</b></span></div><div class="b"><i style="left:calc(${Math.min(100,Math.max(0,(c.price-c.lo)/((c.hi-c.lo)||1)*100))}% - 2px)"></i></div></div>
   <div class="stats"><div><small>Market cap</small><b>${big(c.cap)}</b></div><div><small>Volume 24h</small><b>${big(c.vol)}</b></div><div><small>Circulating supply</small><b>${c.supply?Math.round(c.supply).toLocaleString()+' '+c.sym.toUpperCase():'—'}</b></div><div><small>All-time high</small><b>${fmtP(c.ath)}</b> <span class="m" style="font-size:.76rem">${pct(c.athc)}</span></div></div>
   <div class="conv"><h4>Converter</h4><div class="r"><input id="cvA" value="${amt}" inputmode="decimal" aria-label="${c.sym} amount"><span>${c.sym.toUpperCase()}</span></div><div class="r"><input id="cvB" inputmode="decimal" aria-label="${cur} amount"><span>${cur.toUpperCase()}</span></div></div>
   <button class="dw${watch.includes(c.id)?' on':''}" id="dwb">${watch.includes(c.id)?'★ In your watchlist':'☆ Add to watchlist'}</button>`;
  const A=$('#cvA'),B=$('#cvB'),fix=v=>v>=1?v.toFixed(2):v.toPrecision(6);B.value=fix(parseFloat(A.value||0)*c.price);
  A.oninput=()=>{B.value=fix((parseFloat(A.value.replace(',','.'))||0)*c.price)};B.oninput=()=>{A.value=+((parseFloat(B.value.replace(',','.'))||0)/c.price).toPrecision(8)};
  $('#dx').onclick=closeD;$('#dwb').onclick=()=>toggleW(c.id);
  const svg=$('#bc svg'),tt=$('#btt'),pts=c.sp;if(svg&&pts.length){svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),i=Math.round((e.clientX-r.left)/r.width*(pts.length-1)),t=new Date(Date.now()-(pts.length-1-i)*36e5);
    tt.innerHTML=`${t.toLocaleDateString('en-US',{month:'short',day:'numeric'})} ${t.toLocaleTimeString('en-US',{hour:'numeric'})} · <b>${fmtP(pts[i])}</b>`;tt.style.left=e.clientX-r.left+'px';tt.style.top=e.clientY-r.top+'px';tt.style.opacity=1};svg.onmouseleave=()=>tt.style.opacity=0}
  if(!keep){$('#drawer').classList.add('open');$('#ov').classList.add('open')}}
function closeD(){open=null;$('#drawer').classList.remove('open');$('#ov').classList.remove('open')}
function toggleW(id){watch=watch.includes(id)?watch.filter(x=>x!==id):[...watch,id];try{localStorage.setItem('orbit-watch',JSON.stringify(watch))}catch(e){}render()}
$('#tb').onclick=e=>{const s=e.target.closest('[data-w]');if(s){e.stopPropagation();toggleW(s.dataset.w);return}const r=e.target.closest('tr[data-id]');if(r)drawer(r.dataset.id)};
document.querySelector('.hero').onclick=e=>{const r=e.target.closest('[data-id]');if(r)drawer(r.dataset.id)};
document.querySelector('thead').onclick=e=>{const th=e.target.closest('th[data-k]');if(!th)return;if(sortK===th.dataset.k)dir*=-1;else{sortK=th.dataset.k;dir=th.dataset.k==='rank'||th.dataset.k==='name'?1:-1}table()};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;$('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));table()};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();table()};
$('#cur').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.c===cur)return;cur=b.dataset.c;$('#cur').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));coins=[];prevPrice={};load()};
$('#ref').onclick=()=>load(true);$('#ov').onclick=closeD;addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});
load();setInterval(()=>{if(!document.hidden)load()},60000);
</script>
</body>
