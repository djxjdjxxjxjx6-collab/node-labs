<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — Personal Finance Tracker</title>
<meta name="description" content="Demo personal finance app by Yurii Starikov — income and expense tracking, category budgets, charts, monthly reports and CSV export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f1ea;--card:#fffefa;--ink:#141512;--ink2:#56584f;--mut:#93958a;--line:#e3e1d6;--acc:#0e7c5a;--acc-s:#dff0e8;--neg:#d4502f;--neg-s:#fbe7e1;--warn:#c98a10;
  --fb:"Manrope",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1280px;margin:0 auto;padding:22px 24px 50px}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.logo i{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-family:var(--fm);font-size:.9rem}
.month{display:flex;align-items:center;gap:6px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px}
.month button{width:32px;height:32px;border-radius:50%;border:0;background:none;cursor:pointer}
.month button:hover{background:var(--bg)}
.month b{min-width:130px;text-align:center;font-weight:700}
.btn{border:0;border-radius:99px;padding:10px 18px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.hero{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px;margin-top:22px}
@media(max-width:1000px){.hero{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.bal{background:var(--ink);color:var(--bg);border:0;position:relative;overflow:hidden}
.bal small{color:#b7b9ad}
.bal .big{font-size:clamp(2rem,4vw,2.9rem);font-weight:600;margin:6px 0 4px}
.bal .rate{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.1);border-radius:99px;padding:3px 10px;font-size:.8rem}
.bal svg.wave{position:absolute;right:-10px;bottom:-10px;width:60%;opacity:.5}
.kpi small{color:var(--mut);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:1.6rem;font-weight:600;margin-top:8px}
.kpi .d{font-size:.78rem;margin-top:2px}
.up{color:var(--acc)}.dn{color:var(--neg)}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:14px;align-items:start}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
h3{font-size:1rem;font-weight:800;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:10px}
h3 small{font-weight:500;color:var(--mut);font-size:.8rem}
.bars{margin-top:16px;position:relative}
.bars svg{width:100%;height:220px;display:block;overflow:visible}
.bars .tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 10px;border-radius:8px;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s;white-space:nowrap}
.donut{display:flex;gap:18px;align-items:center;margin-top:14px;flex-wrap:wrap}
.donut svg{width:170px;height:170px;flex:none}
.legend{display:grid;gap:8px;flex:1;min-width:160px}
.legend div{display:flex;align-items:center;gap:8px;font-size:.86rem}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{margin-left:auto}
.budgets{display:grid;gap:14px;margin-top:14px}
.bud .t{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600}
.bud .t span{color:var(--mut);font-weight:500}
.bud .bar{height:9px;background:var(--bg);border-radius:9px;margin-top:6px;overflow:hidden;border:1px solid var(--line)}
.bud .bar i{display:block;height:100%;border-radius:9px;transition:width .6s}
.bud .w{font-size:.74rem;margin-top:4px}
.tx .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tx .tools input,.tx .tools select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;outline:0}
.tx .tools input{flex:1;min-width:160px}
.rows{margin-top:10px;max-height:470px;overflow:auto}
.day{font-size:.74rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;padding:14px 4px 6px;display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:40px 1fr auto auto;gap:12px;align-items:center;padding:10px 6px;border-radius:12px}
.row:hover{background:var(--bg)}
.row .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.1rem}
.row b{display:block;font-weight:600}
.row small{color:var(--mut)}
.row .amt{font-weight:600}
.row .del{opacity:0;border:0;background:none;cursor:pointer;color:var(--mut);width:28px;height:28px;border-radius:8px}
.row:hover .del{opacity:1}
.row .del:hover{background:var(--neg-s);color:var(--neg)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
/* add panel */
.add{display:grid;gap:12px;margin-top:14px}
.type{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;border:1px solid var(--line)}
.type button{border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--ink2)}
.type button.on.e{background:var(--neg);color:#fff}.type button.on.i{background:var(--acc);color:#fff}
.amt-in{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:0 14px}
.amt-in span{font-family:var(--fm);font-size:1.6rem;color:var(--mut)}
.amt-in input{border:0;outline:0;background:none;font-family:var(--fm);font-size:1.8rem;padding:10px 8px;width:100%;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;cursor:pointer;font-size:.72rem;font-weight:600;display:grid;gap:2px;justify-items:center;color:var(--ink2)}
.cats button span{font-size:1.15rem}
.cats button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add input.f{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;outline:0;width:100%}
.add .err{color:var(--neg);font-size:.8rem;min-height:1em}
.add .btn{justify-content:center;padding:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,90px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;font-size:.86rem;z-index:90;transition:.3s;display:flex;gap:12px;align-items:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast button{background:none;border:0;color:#7fe0b8;font-weight:700;cursor:pointer}
.demo{text-align:center;color:var(--mut);font-size:.78rem;margin-top:24px}.demo a{color:var(--acc)}
.sidecol{display:grid;gap:14px;align-content:start}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><i>L</i>Ledger</div>
  <div class="month"><button id="prev" aria-label="Previous month">‹</button><b id="mLabel"></b><button id="next" aria-label="Next month">›</button></div>
  <button class="btn ghost" id="csv"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Export CSV</button>
  <button class="btn ghost" id="reset" title="Restore sample data">Reset demo</button>
</header>

<section class="hero">
  <div class="card bal"><small>Balance this month</small><div class="big num" id="balance"></div><span class="rate" id="srate"></span>
    <svg class="wave" viewBox="0 0 200 80"><path d="M0 60 C30 50 40 20 70 30 S120 70 150 40 S190 10 200 15 V80 H0Z" fill="#0e7c5a"/></svg></div>
  <div class="card kpi"><small><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;color:var(--acc)"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Income</small><div class="v num up" id="inc"></div><div class="d" id="incD"></div></div>
  <div class="card kpi"><small><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;color:var(--neg)"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Expenses</small><div class="v num dn" id="exp"></div><div class="d" id="expD"></div></div>
  <div class="card kpi"><small><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>Avg. per day</small><div class="v num" id="avg"></div><div class="d" id="avgD" style="color:var(--mut)"></div></div>
</section>

<div class="grid">
  <div style="display:grid;gap:14px;min-width:0">
    <div class="card"><h3>Daily spending <small id="barSub"></small></h3><div class="bars" id="bars"><div class="tt" id="tt"></div></div></div>
    <div class="card tx"><h3>Transactions <small id="txCount"></small></h3>
      <div class="tools"><input id="q" placeholder="Search notes or categories…"><select id="fc"><option value="">All categories</option></select><select id="ft"><option value="">All types</option><option value="e">Expenses</option><option value="i">Income</option></select></div>
      <div class="rows" id="rows"></div></div>
  </div>
  <div class="sidecol">
    <div class="card"><h3>Add transaction</h3>
      <form class="add" id="add" novalidate>
        <div class="type" id="type"><button type="button" class="e on" data-t="e">Expense</button><button type="button" class="i" data-t="i">Income</button></div>
        <label class="amt-in"><span>$</span><input id="amt" inputmode="decimal" placeholder="0.00" aria-label="Amount"></label>
        <div class="cats" id="cats"></div>
        <div class="two"><input class="f" id="note" placeholder="Note (optional)"><input class="f" id="date" type="date"></div>
        <div class="err" id="err"></div>
        <button class="btn dark" type="submit">Add transaction</button>
      </form></div>
    <div class="card"><h3>Where it went <small id="donutSub"></small></h3><div class="donut"><svg viewBox="0 0 42 42" id="donut"></svg><div class="legend" id="legend"></div></div></div>
    <div class="card"><h3>Monthly budgets <small>edit by clicking a limit</small></h3><div class="budgets" id="budgets"></div></div>
  </div>
</div>
<p class="demo">Demo project · Data is saved in your browser · Built by <a href="https://github.com/djxjdjxxjxjx6-collab">Yurii Starikov</a></p>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const CATS={food:['Groceries','🛒','#0e7c5a'],eat:['Eating out','🍜','#d4502f'],home:['Rent & bills','🏠','#3b5bdb'],move:['Transport','🚇','#c98a10'],fun:['Fun','🎬','#a33ea1'],shop:['Shopping','🛍️','#0b8aa8'],health:['Health','💊','#6b7a2a'],other:['Other','✨','#8a8f80']};
const INC={salary:['Salary','💼','#0e7c5a'],free:['Freelance','💻','#2b8a3e'],gift:['Gifts','🎁','#5c940d']};
const ALL={...CATS,...INC};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function seedData(){let s=11;const r=()=>(s=s*16807%2147483647)/2147483647;const out=[];const now=new Date();
  for(let m=-2;m<=0;m++){const base=new Date(now.getFullYear(),now.getMonth()+m,1),days=m===0?now.getDate():new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
    out.push({t:'i',c:'salary',a:4200,n:'Monthly salary',d:iso(new Date(base.getFullYear(),base.getMonth(),1))});
    out.push({t:'e',c:'home',a:1350,n:'Rent',d:iso(new Date(base.getFullYear(),base.getMonth(),2))});
    out.push({t:'e',c:'home',a:96+Math.round(r()*30),n:'Electricity & internet',d:iso(new Date(base.getFullYear(),base.getMonth(),Math.min(5,days)))});
    if(days>12)out.push({t:'i',c:'free',a:350+Math.round(r()*600),n:'Website project',d:iso(new Date(base.getFullYear(),base.getMonth(),12))});
    for(let day=1;day<=days;day++){const dd=iso(new Date(base.getFullYear(),base.getMonth(),day));
      if(r()<.45)out.push({t:'e',c:'food',a:+(18+r()*70).toFixed(2),n:['Whole Foods','Trader Joe\'s','Farmers market','Corner store'][Math.floor(r()*4)],d:dd});
      if(r()<.3)out.push({t:'e',c:'eat',a:+(9+r()*45).toFixed(2),n:['Ramen bar','Coffee & croissant','Pizza night','Sushi lunch'][Math.floor(r()*4)],d:dd});
      if(r()<.25)out.push({t:'e',c:'move',a:+(2.5+r()*20).toFixed(2),n:['Metro card top-up','Uber','Gas'][Math.floor(r()*3)],d:dd});
      if(r()<.1)out.push({t:'e',c:'fun',a:+(12+r()*60).toFixed(2),n:['Cinema','Concert tickets','Streaming','Bowling'][Math.floor(r()*4)],d:dd});
      if(r()<.08)out.push({t:'e',c:'shop',a:+(20+r()*140).toFixed(2),n:['New sneakers','Books','Home decor'][Math.floor(r()*3)],d:dd});
      if(r()<.04)out.push({t:'e',c:'health',a:+(10+r()*60).toFixed(2),n:['Pharmacy','Gym class'][Math.floor(r()*2)],d:dd});}}
  return out.map((x,i)=>({...x,id:'x'+i}))}
let tx,budgets;try{tx=JSON.parse(localStorage.getItem('ledger-tx'));budgets=JSON.parse(localStorage.getItem('ledger-bud'))}catch(e){}
if(!Array.isArray(tx))tx=seedData();budgets=budgets||{food:600,eat:300,move:150,fun:150,shop:250,home:1500};
const now=new Date();let cur=new Date(now.getFullYear(),now.getMonth(),1),type='e',cat='food',lastDel=null;
const save=()=>{try{localStorage.setItem('ledger-tx',JSON.stringify(tx));localStorage.setItem('ledger-bud',JSON.stringify(budgets))}catch(e){}};
const money=(n,dec=0)=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const inMonth=(d,m)=>tx.filter(x=>x.d.startsWith(ym(m)));
function render(){
  const list=inMonth(tx,cur),prevM=new Date(cur.getFullYear(),cur.getMonth()-1,1),prev=inMonth(tx,prevM);
  const sum=(l,t)=>l.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0);
  const inc=sum(list,'i'),exp=sum(list,'e'),pinc=sum(prev,'i'),pexp=sum(prev,'e');
  const isNow=ym(cur)===ym(now),days=isNow?now.getDate():new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
  $('#mLabel').textContent=cur.toLocaleDateString('en-US',{month:'long',year:'numeric'});$('#next').disabled=isNow;$('#next').style.opacity=isNow?.3:1;
  $('#balance').textContent=money(inc-exp,2);
  $('#srate').innerHTML=inc?`${inc-exp>=0?'▲':'▼'} You saved ${Math.round((inc-exp)/inc*100)}% of income`:'No income yet';
  $('#inc').textContent=money(inc);$('#exp').textContent=money(exp);
  const delta=(a,b,good)=>{if(!b)return '<span style="color:var(--mut)">No data last month</span>';const p=(a/b-1)*100,ok=good?p>=0:p<=0;return `<span class="${ok?'up':'dn'}">${p>=0?'+':''}${p.toFixed(1)}%</span> <span style="color:var(--mut)">vs ${prevM.toLocaleDateString('en-US',{month:'short'})}</span>`};
  $('#incD').innerHTML=delta(inc,pinc,true);$('#expD').innerHTML=delta(exp,pexp,false);
  $('#avg').textContent=money(exp/Math.max(1,days),2);$('#avgD').textContent=`over ${days} days`;
  bars(list,new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),days);donut(list,exp);renderBudgets(list);rows();
}
function bars(list,days,elapsed){
  const vals=[...Array(days)].map((_,i)=>list.filter(x=>x.t==='e'&&x.c!=='home'&&+x.d.slice(8)===i+1).reduce((s,x)=>s+x.a,0));
  const W=Math.max(320,$('#bars').clientWidth||700),H=220,pl=40,pb=24,w=(W-pl)/days,mx=Math.max(50,Math.ceil(Math.max(...vals)/50)*50);
  const avg=vals.reduce((a,b)=>a+b,0)/Math.max(1,elapsed);
  let g='';for(let k=0;k<=4;k++){const y=(H-pb)*(1-k/4);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mut)" font-family="JetBrains Mono">${Math.round(mx*k/4)}</text>`}
  const b=vals.map((v,i)=>{const h=(H-pb)*v/mx,x=pl+i*w+w*.18;return `<rect data-i="${i}" x="${x}" y="${H-pb-h}" width="${w*.64}" height="${Math.max(h,1.5)}" rx="${Math.min(4,w*.3)}" fill="${v>avg*1.6?'var(--neg)':'var(--ink)'}" opacity="${v?1:.15}"/>${(i+1)%5===0||i===0?`<text x="${x+w*.32}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="JetBrains Mono">${i+1}</text>`:''}`}).join('');
  const ay=(H-pb)*(1-avg/mx);
  $('#bars').querySelector('svg')?.remove();
  $('#bars').insertAdjacentHTML('afterbegin',`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}${b}<line x1="${pl}" x2="${W}" y1="${ay}" y2="${ay}" stroke="var(--acc)" stroke-dasharray="4 4"/><text x="${W}" y="${ay-6}" text-anchor="end" font-size="10" fill="var(--acc)" font-family="JetBrains Mono">avg $${avg.toFixed(0)}</text></svg>`);
  $('#barSub').textContent='excluding rent · red = unusually high day';
  const svg=$('#bars svg'),tt=$('#tt');
  svg.onmousemove=e=>{const r=e.target.closest('rect');if(!r){tt.style.opacity=0;return}const i=+r.dataset.i,box=svg.getBoundingClientRect(),rb=r.getBoundingClientRect();
    tt.innerHTML=`${new Date(cur.getFullYear(),cur.getMonth(),i+1).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})} · <b>${money(vals[i],2)}</b>`;tt.style.left=rb.left-box.left+rb.width/2+'px';tt.style.top=rb.top-box.top+'px';tt.style.opacity=1};
  svg.onmouseleave=()=>tt.style.opacity=0;
}
function donut(list,exp){
  const by={};list.filter(x=>x.t==='e').forEach(x=>by[x.c]=(by[x.c]||0)+x.a);const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  let off=25,seg='';ent.forEach(([c,v])=>{const p=v/exp*100;seg+=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${CATS[c][2]}" stroke-width="6" stroke-dasharray="${Math.max(p-.6,0)} ${100-p+.6}" stroke-dashoffset="${off}"/>`;off-=p});
  $('#donut').innerHTML=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--line)" stroke-width="6"/>${seg}<text x="21" y="20.5" text-anchor="middle" font-size="4.2" font-weight="700" fill="var(--ink)" font-family="JetBrains Mono">${money(exp)}</text><text x="21" y="25.5" text-anchor="middle" font-size="2.6" fill="var(--mut)">spent</text>`;
  $('#legend').innerHTML=ent.length?ent.slice(0,6).map(([c,v])=>`<div><i style="background:${CATS[c][2]}"></i>${CATS[c][0]}<b class="num">${Math.round(v/exp*100)}%</b></div>`).join(''):'<div style="color:var(--mut)">No expenses yet</div>';
  $('#donutSub').textContent=ent.length?`${ent.length} categories`:'';
}
function renderBudgets(list){
  $('#budgets').innerHTML=Object.entries(budgets).map(([c,lim])=>{const sp=list.filter(x=>x.t==='e'&&x.c===c).reduce((s,x)=>s+x.a,0),p=sp/lim*100,col=p>100?'var(--neg)':p>85?'var(--warn)':'var(--acc)';
    return `<div class="bud"><div class="t">${CATS[c][1]} ${CATS[c][0]}<span class="num">${money(sp)} / <button data-b="${c}" style="border:0;background:none;text-decoration:underline dotted;cursor:pointer" class="num" title="Edit budget">${money(lim)}</button></span></div>
     <div class="bar"><i style="width:${Math.min(p,100)}%;background:${col}"></i></div>${p>100?`<div class="w dn">Over budget by ${money(sp-lim)}</div>`:p>85?`<div class="w" style="color:var(--warn)">${money(lim-sp)} left · almost there</div>`:''}</div>`}).join('');
}
function rows(){
  const q=$('#q').value.trim().toLowerCase(),fc=$('#fc').value,ft=$('#ft').value;
  const list=inMonth(tx,cur).filter(x=>(!fc||x.c===fc)&&(!ft||x.t===ft)&&(!q||(x.n+' '+ALL[x.c][0]).toLowerCase().includes(q))).sort((a,b)=>b.d.localeCompare(a.d)||b.id.localeCompare(a.id));
  $('#txCount').textContent=`${list.length} this month`;
  const groups={};list.forEach(x=>(groups[x.d]=groups[x.d]||[]).push(x));
  $('#rows').innerHTML=list.length?Object.entries(groups).map(([d,l])=>{const tot=l.reduce((s,x)=>s+(x.t==='e'?-x.a:x.a),0);
    return `<div class="day"><span>${new Date(d+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</span><span class="num">${money(tot,2)}</span></div>`+l.map(x=>{const c=ALL[x.c];
      return `<div class="row"><span class="ic" style="background:${c[2]}1c">${c[1]}</span><div><b>${x.n||c[0]}</b><small>${c[0]}</small></div><span class="amt num ${x.t==='i'?'up':''}">${x.t==='i'?'+':'−'}${money(x.a,2)}</span><button class="del" data-id="${x.id}" aria-label="Delete">✕</button></div>`}).join('')}).join('')
    :'<div class="empty">No transactions match. Try another search or add one on the right.</div>';
}
function renderCats(){const src=type==='e'?CATS:INC;if(!src[cat])cat=Object.keys(src)[0];
  $('#cats').innerHTML=Object.entries(src).map(([k,[n,e]])=>`<button type="button" data-c="${k}" class="${k===cat?'on':''}"><span>${e}</span>${n}</button>`).join('')}
$('#fc').innerHTML+=Object.entries(ALL).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
$('#type').onclick=e=>{const b=e.target.closest('button');if(!b)return;type=b.dataset.t;$('#type').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderCats()};
$('#cats').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;renderCats()};
$('#date').value=iso(now);
$('#add').onsubmit=e=>{e.preventDefault();const a=parseFloat($('#amt').value.replace(',','.'));
  if(!(a>0)){$('#err').textContent='Enter an amount greater than 0';$('#amt').focus();return}
  if(!$('#date').value){$('#err').textContent='Pick a date';return}
  $('#err').textContent='';const x={id:'u'+Date.now(),t:type,c:cat,a:Math.round(a*100)/100,n:$('#note').value.trim(),d:$('#date').value};tx.push(x);save();
  const dd=new Date(x.d+'T12:00');cur=new Date(dd.getFullYear(),dd.getMonth(),1);$('#amt').value='';$('#note').value='';render();toast(`${type==='e'?'Expense':'Income'} of ${money(x.a,2)} added`)};
$('#rows').onclick=e=>{const b=e.target.closest('.del');if(!b)return;const i=tx.findIndex(x=>x.id===b.dataset.id);lastDel={x:tx[i],i};tx.splice(i,1);save();render();toast('Transaction deleted',true)};
$('#budgets').onclick=e=>{const b=e.target.closest('[data-b]');if(!b)return;const c=b.dataset.b;const inp=document.createElement('input');inp.type='number';inp.value=budgets[c];inp.className='num';inp.style.cssText='width:80px;border:1px solid var(--ink);border-radius:6px;padding:0 6px';
  b.replaceWith(inp);inp.focus();inp.select();const done=()=>{const v=parseFloat(inp.value);if(v>0)budgets[c]=Math.round(v);save();render()};inp.onblur=done;inp.onkeydown=ev=>{if(ev.key==='Enter')inp.blur();if(ev.key==='Escape'){inp.value=budgets[c];inp.blur()}}};
['q','fc','ft'].forEach(id=>$('#'+id).addEventListener('input',rows));
$('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$('#next').onclick=()=>{if(ym(cur)!==ym(now)){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()}};
$('#csv').onclick=()=>{const l=inMonth(tx,cur).sort((a,b)=>a.d.localeCompare(b.d));const csv='Date,Type,Category,Note,Amount\n'+l.map(x=>[x.d,x.t==='e'?'Expense':'Income',ALL[x.c][0],'"'+(x.n||'').replace(/"/g,'""')+'"',(x.t==='e'?-x.a:x.a).toFixed(2)].join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`ledger-${ym(cur)}.csv`;a.click();toast(`Exported ${l.length} transactions`)};
$('#reset').onclick=()=>{tx=seedData();budgets={food:600,eat:300,move:150,fun:150,shop:250,home:1500};save();cur=new Date(now.getFullYear(),now.getMonth(),1);render();toast('Sample data restored')};
function toast(m,undo){const el=$('#toast');el.innerHTML=m+(undo?' <button id="undo">Undo</button>':'');el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),3500);
  if(undo)$('#undo').onclick=()=>{if(lastDel){tx.splice(lastDel.i,0,lastDel.x);lastDel=null;save();render();el.classList.remove('show')}}}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150)});
renderCats();render();
</script>
</body>
</html>
